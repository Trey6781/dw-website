<html><head><meta charset="utf-8"><style>
*{box-sizing:border-box;margin:0;padding:0}
body{width:1200px;height:1460px;background:#071E31;
  font-family:'Arial Black','Helvetica Neue',Helvetica,Arial,sans-serif;color:#F7E7C6;
  background-image:repeating-linear-gradient(135deg,#0B2B45 0 30px,#0d3252 30px 60px);}
.hd{text-align:center;padding:38px 0 26px;border-bottom:5px solid #F2711C;
  background:linear-gradient(180deg,rgba(7,30,49,.55),rgba(7,30,49,.9))}
.hd .t{font-size:46px;letter-spacing:-.5px;line-height:1.05}
.hd .s{margin-top:12px;font-size:23px;color:#F6A623;letter-spacing:3px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:26px;padding:30px 34px}
.cell{background:repeating-linear-gradient(90deg,#d8c9a8 0 70px,#d2c19d 70px 72px),#d8c9a8;
  border-radius:20px;height:490px;position:relative;display:flex;align-items:center;
  justify-content:center;padding:44px 26px 26px;box-shadow:0 10px 26px rgba(0,0,0,.45)}
.cell img{max-width:100%;max-height:100%;object-fit:contain;
  filter:drop-shadow(0 8px 14px rgba(0,0,0,.3))}
.tag{position:absolute;top:-16px;left:-10px;background:#F2711C;color:#fff;
  width:74px;height:74px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:40px;border:6px solid #071E31;box-shadow:0 5px 14px rgba(0,0,0,.4)}
.nm{position:absolute;bottom:14px;left:0;right:0;text-align:center;color:#0B2B45;
  font-size:19px;letter-spacing:1.6px}
.ft{text-align:center;padding:24px 0 34px;font-size:32px;letter-spacing:2px}
.ft span{color:#F6A623}
</style></head><body>
<div class="hd">
  <div class="t">BROAD RIVER BOAT SODA CLUB</div>
  <div class="s">WHICH STICKER GOES ON THE COOLERS?</div>
</div>
<div class="grid">
  <div class="cell"><div class="tag">A</div>
    <img src="/home/user/dw-website/boat-soda-club/brbsc-roundel-4.5in.svg" style="max-height:370px">
    <div class="nm">THE ROUNDEL</div></div>
  <div class="cell"><div class="tag">B</div>
    <img src="/home/user/dw-website/boat-soda-club/brbsc-crest-4x5in.svg" style="max-height:370px">
    <div class="nm">THE CREST</div></div>
  <div class="cell"><div class="tag">C</div>
    <img src="/home/user/dw-website/boat-soda-club/brbsc-banner-6x2in.svg" style="max-height:200px">
    <div class="nm">THE BANNER</div></div>
  <div class="cell"><div class="tag">D</div>
    <img src="/home/user/dw-website/boat-soda-club/brbsc-mini-2in.svg" style="max-height:300px">
    <div class="nm">THE MINI &mdash; BRBSC</div></div>
</div>
<div class="ft">REPLY <span>A</span> &nbsp;<span>B</span> &nbsp;<span>C</span> &nbsp;<span>D</span></div>
</body></html>
